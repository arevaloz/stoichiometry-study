<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a2c28" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Stoich Study" />
    <title>Stoichiometry Study</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <header class="top">
      <p class="brand">Stoichiometry Study</p>
      <p class="progress" id="progress">Card 1 of 1</p>
    </header>

    <main class="stage">
      <p class="deck-label" id="deckLabel">Concepts</p>

      <button
        type="button"
        class="card"
        id="card"
        aria-live="polite"
        aria-label="Flashcard. Click or press space to flip."
      >
        <span class="card-hint" id="cardHint">Tap to flip</span>
        <span class="card-text" id="cardText"></span>
      </button>

      <div class="actions" id="actions" hidden>
        <button type="button" class="btn again" id="againBtn">Again</button>
        <button type="button" class="btn got-it" id="gotItBtn">Got it</button>
      </div>

      <p class="help" id="help">
        Flip the card, then mark whether you knew it.
      </p>
    </main>

    <nav class="decks" aria-label="Deck chooser">
      <button type="button" class="deck active" data-deck="concepts">
        Concepts
      </button>
      <button type="button" class="deck" data-deck="balancing">
        Balancing
      </button>
      <button type="button" class="deck" data-deck="stoichiometry">
        Stoichiometry
      </button>
    </nav>

    <script src="app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      }
    </script>
  </body>
</html>
